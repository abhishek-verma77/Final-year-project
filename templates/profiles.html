<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Job Profiles - Relevance Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      color: #E0E1E9;
      background: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1600&q=80")
                  no-repeat center center fixed;
      background-size: cover;
      margin: 0;
    }
    .overlay {
      position: fixed; inset: 0;
      background: rgba(18,18,22,0.9);
      z-index: 0;
    }
    .page-header {
      position: fixed;
      top: 20px; left: 40px;
      font-size: 1.5em;
      font-weight: 700;
      color: #fff;
      z-index: 2;
    }
    .container {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: auto;
      padding-top: 120px;
      padding-bottom: 40px;
    }
    h2 {
      color: #fff;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }
    .tagline {
      text-align: center;
      font-size: 1.1em;
      color: #bbb;
      margin-bottom: 40px;
    }
    .profile-section {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 16px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #E0E1E9;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.9);  /* lighter for readability */
      color: #111;                        /* dark text */
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 1em;
      transition: border 0.3s, box-shadow 0.3s;
    }
    input::placeholder,
    textarea::placeholder {
      color: #555;   /* softer placeholder */
    }
    select option {
      color: #111;   /* readable dropdown */
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4A90E2;
      box-shadow: 0 0 0 3px rgba(74,144,226,0.3);
    }
    button {
      background: linear-gradient(135deg, #4A90E2, #00AFFF);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }
    #addNewBtn {
      background: rgba(255,255,255,0.1);
      margin-left: 10px;
    }
    #addNewBtn:hover {
      background: rgba(255,255,255,0.2);
    }
    #newProfileSection { display: none; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <header class="page-header">Relevance Engine</header>

  <div class="container">
    <h2>Manage Job Profiles</h2>
    <p class="tagline">Manage existing job profiles or create a new one for interviews.</p>

    <div class="profile-section">
      <h3>Select Existing Profile</h3>
      <div class="form-group">
        <label for="profileSelect">Choose a Job Title</label>
        <select id="profileSelect">
          <option value="">-- Select a Profile --</option>
        </select>
      </div>
      <button id="startInterviewBtn">Start Interview</button>
      <button id="addNewBtn">+ Add New</button>
    </div>

    <div id="newProfileSection" class="profile-section">
      <h3>Create New Profile</h3>
      <form id="newProfileForm">
        <div class="form-group">
          <label for="jobTitle">Job Title</label>
          <input type="text" id="jobTitle" required placeholder="e.g., Software Engineer">
        </div>
        <div class="form-group">
          <label for="keywords">Keywords (comma-separated)</label>
          <textarea id="keywords" rows="3" placeholder="e.g., python, api, git, agile"></textarea>
        </div>
        <button type="submit">Save Profile</button>
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    const profileSelect = document.getElementById('profileSelect');
    const addNewBtn = document.getElementById('addNewBtn');
    const newProfileSection = document.getElementById('newProfileSection');
    const newProfileForm = document.getElementById('newProfileForm');
    const startInterviewBtn = document.getElementById('startInterviewBtn');

    async function loadProfiles() {
      const response = await fetch('/get_profiles');
      const profiles = await response.json();
      profileSelect.innerHTML = '<option value="">-- Select a Profile --</option>';
      for (const title in profiles) {
        const option = document.createElement('option');
        option.value = title;
        option.textContent = title;
        profileSelect.appendChild(option);
      }
    }
    addNewBtn.onclick = () => { newProfileSection.style.display = 'block'; };
    newProfileForm.onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('jobTitle').value;
      const keywords = document.getElementById('keywords').value.split(',').map(k => k.trim()).filter(k => k);
      await fetch('/add_profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, keywords })
      });
      alert('Profile saved!');
      document.getElementById('jobTitle').value = '';
      document.getElementById('keywords').value = '';
      newProfileSection.style.display = 'none';
      loadProfiles();
    };
    startInterviewBtn.onclick = () => {
      const selectedProfile = profileSelect.value;
      if (selectedProfile) {
        window.location.href = `/create_interview?profile=${encodeURIComponent(selectedProfile)}`;
      } else {
        alert('Please select a job profile first.');
      }
    };

    loadProfiles();
  </script>
</body>
</html>
