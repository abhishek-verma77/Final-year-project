<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interview Session - Relevance Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: #E0E1E9;
            background-color: #1A1A1D;
            margin: 0;
        }
        .page-header {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: calc(100% - 80px);
        }
        .page-header h1 {
            font-size: 2.2em;
            color: #FFFFFF;
            margin: 0;
            font-weight: 700;
        }
        .theme-toggle {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2C2C34;
            color: #fff;
            cursor: pointer;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .theme-toggle option {
            background: #2C2C34;
            color: #fff;
        }
        .interview-container {
            display: flex;
            padding-top: 100px;
            height: 100vh;
            box-sizing: border-box;
        }
        .main {
            flex-grow: 1;
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
        }
        .sidebar {
            width: 300px;
            padding: 30px;
            border-left: 1px solid #383842;
            background-color: #25252A;
            flex-shrink: 0;
        }
        h1, h3 { color: #FFFFFF; font-weight: 700; }
        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Inter', system-ui, sans-serif;
        }
        button:hover { background-color: #5AA0F2; transform: translateY(-1px); }
        button:disabled { background-color: #555; cursor: not-allowed; transform: translateY(0); }
        .header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        #transcript {
            background-color: #1E1E1E;
            border: 1px solid #444;
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            border-radius: 12px;
        }
        #transcript p { margin: 0 0 1em 0; line-height: 1.6; }
        #transcript p strong { color: #4A90E2; }
        .sidebar-section { margin-bottom: 30px; }
        .metric { background-color: #383842; padding: 15px; border-radius: 8px; }
        .metric-label { font-weight: 500; color: #A9A9B3; font-size: 0.9em; }
        .metric-value { font-size: 1.8em; font-weight: 700; color: #FFFFFF; }
        #shareLink {
            width: 100%;
            padding: 8px;
            background-color: #2C2C34;
            color: #F5F5F5;
            border: 1px solid #4F4F5A;
            border-radius: 8px;
            box-sizing: border-box;
        }
        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #28a745;
            color: white;
            padding: 15px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }
        #notification.show { opacity: 1; visibility: visible; }

        /* Light theme */
        body.light-theme { background: #f5f5f5; color: #222; }
        body.light-theme .page-header h1 { color: #1A1A1D; }
        body.light-theme .theme-toggle {
            background: #fff;
            color: #222 !important;
            border: 1px solid #ccc;
        }
        body.light-theme .theme-toggle option {
            background: #fff;
            color: #222 !important;
        }
        body.light-theme .sidebar { background: #eaeaea; border-left: 1px solid #ccc; }
        body.light-theme h3 { color: #1A1A1D; }
        body.light-theme #transcript { background: #fff; color: #222; border: 1px solid #ddd; }
        body.light-theme #transcript p strong { color: #4A90E2; }
        body.light-theme .metric { background: #ddd; color: #111; }
        body.light-theme .metric-value { color: #000; }
        body.light-theme .sidebar-section p { color: #333 !important; }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>Relevance Engine</h1>
        <select class="theme-toggle" id="themeSelector">
            <option value="dark">Dark Theme</option>
            <option value="light">Light Theme</option>
        </select>
    </header>

    <div class="interview-container">
        <div class="main">
            <div class="header">
                <button id="startButton">Start Session</button>
                <button id="stopButton" disabled>Stop Session</button>
            </div>
            <div id="transcript"></div>
        </div>
        <div class="sidebar" id="sidebar">
            <div id="interviewerControls">
                <div class="sidebar-section">
                    <h3>Interviewer Controls</h3>
                    <p style="font-size: 0.9em;">Share this link with the candidate:</p>
                    <input type="text" id="shareLink" readonly>
                    <button id="copyLinkBtn" style="width: 100%; margin-top: 10px;">Copy Link</button>
                </div>
                <div class="sidebar-section">
                    <button id="triggerScoreBtn" style="width: 100%;">Calculate Relevance Score</button>
                </div>
                <div class="sidebar-section">
                     <h3>Answer Relevance</h3>
                    <div class="metric"><div class="metric-value" id="score">--%</div></div>
                </div>
                <div class="sidebar-section">
                    <h3>Clarity Metrics</h3>
                    <div class="metric">
                        <div class="metric-label">Filler Words</div>
                        <div class="metric-value" id="fillerWords">I: 0 | C: 0</div>
                    </div>
                </div>
                 <div class="sidebar-section">
                    <button id="generateReportBtn" disabled style="width: 100%;">Generate Final Report</button>
                </div>
            </div>
            <div id="candidateInfo" style="display: none;">
                <h3>Candidate View</h3>
                <p>Your audio is being transcribed live. Good luck!</p>
            </div>
        </div>
    </div>
    <div id="notification">The candidate has joined the session!</div>

    <script>
        const socket = io();
        let mediaRecorder, localStream;
        const room_id = "{{ room_id }}";
        const token = "{{ token }}";
        let userRole = '';

        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const transcriptDiv = document.getElementById('transcript');
        const shareLinkInput = document.getElementById('shareLink');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const triggerScoreBtn = document.getElementById('triggerScoreBtn');
        const generateReportBtn = document.getElementById('generateReportBtn');
        const sidebar = document.getElementById('sidebar');
        const notification = document.getElementById('notification');
        const themeSelector = document.getElementById('themeSelector');

        window.onload = () => {
            if (token) {
                sessionStorage.setItem(`interviewer-token-${room_id}`, token);
            }
            const interviewerToken = sessionStorage.getItem(`interviewer-token-${room_id}`);
            socket.emit('join', { room: room_id, token: interviewerToken });
            const candidateLink = window.location.href.split('?')[0];
            shareLinkInput.value = candidateLink;
        };
        startButton.onclick = async () => {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { noiseSuppression: true, echoCancellation: true }
            });
            mediaRecorder = new MediaRecorder(localStream);
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) socket.emit('audio_data', event.data);
            };
            mediaRecorder.start(5000); 
            startButton.disabled = true;
            if (userRole === 'interviewer') stopButton.disabled = false;
        };
        stopButton.onclick = () => {
            if (mediaRecorder) {
                mediaRecorder.stop();
                localStream.getTracks().forEach(track => track.stop());
                startButton.disabled = false;
                stopButton.disabled = true;
                if (userRole === 'interviewer') generateReportBtn.disabled = false;
            }
        };
        copyLinkBtn.onclick = () => {
            shareLinkInput.select();
            document.execCommand('copy');
        };
        triggerScoreBtn.onclick = () => {
            socket.emit('trigger_score', { room: room_id });
        };
        generateReportBtn.onclick = () => {
            window.open(`/report/${room_id}`, '_blank');
        };
        socket.on('assign_role', (data) => {
            userRole = data.role;
            if (userRole === 'candidate') {
                sidebar.style.display = 'none';
                stopButton.style.display = 'none';
            }
        });
        socket.on('candidate_joined', () => {
            notification.classList.add('show');
            setTimeout(() => { notification.classList.remove('show'); }, 4000);
        });
        socket.on('transcript_update', (data) => {
            transcriptDiv.innerHTML += `<p><strong>${data.speaker}:</strong> ${data.text}</p>`;
            transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        });
        socket.on('relevance_score', (data) => {
            document.getElementById('score').innerText = `${data.score}%`;
        });
        socket.on('clarity_update', (data) => {
            if (data.fillers) {
                document.getElementById('fillerWords').innerText = `I: ${data.fillers.interviewer} | C: ${data.fillers.candidate}`;
            }
        });
        window.addEventListener("beforeunload", () => {
            if (socket.connected) {
                socket.disconnect();
            }
        });

        // theme switch
        themeSelector.addEventListener('change', (e) => {
            if (e.target.value === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
        });
    </script>
</body>
</html>
